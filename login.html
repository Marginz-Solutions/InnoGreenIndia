<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IGIM Login</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="login-shell"><form class="login-card" onsubmit="return loginApp(event)"><div class="login-head"><img src="assets/igim-logo.png" alt="IGIM Logo"><div><h1>IGIM Login</h1><p>Secure access for field staff, retail planning, and management.</p></div></div><label for="userid">User ID</label><input id="userid" type="text" autocomplete="username" placeholder="Enter user ID"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"><div class="quick-actions"><button class="btn primary" type="submit" style="flex:1">Login to portal</button></div><div id="login-error" class="error">Invalid user ID or password.</div><div class="login-foot">IGIM • Innovate • Farmers • Crops</div></form></div><script src="assets/app.js"></script></body></html>
